name: Classify pull request changes
description: Decide whether a change needs the full quchip test lanes.

outputs:
  full_ci:
    description: Whether the change touches code, tests, examples, packaging, tooling, or CI policy.
    value: ${{ steps.classify.outputs.full_ci }}

runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [[ "$EVENT_NAME" != "pull_request" ]]; then
          echo "full_ci=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        full_ci=false
        while IFS= read -r -d '' changed_file; do
          case "$changed_file" in
            docs/*|*.md|CITATION.cff|LICENSE|.gitignore|.github/workflows/release.yml)
              ;;
            *)
              full_ci=true
              break
              ;;
          esac
        done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")

        echo "full_ci=$full_ci" >> "$GITHUB_OUTPUT"
