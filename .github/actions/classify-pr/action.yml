name: Classify pull request changes
description: Decide whether a change needs the full quchip test lanes.

outputs:
  full_ci:
    description: Whether the change touches code, tests, examples, packaging, tooling, or CI policy.
    value: ${{ steps.classify.outputs.full_ci }}

runs:
  using: composite
  steps:
    - id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        bash "$GITHUB_ACTION_PATH/classify.sh" >> "$GITHUB_OUTPUT"
